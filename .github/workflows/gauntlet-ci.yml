name: Gauntlet CI

on:
  pull_request:
  push:
    branches:
      - feat/gauntlet-loop

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run gauntlet
      - run: npm run gauntlet:example
      - run: npm run gauntlet:requirements
